name: Playwright regression test

# Exercises the front end against a mocked Supabase client (tests/vendor/
# supabase-stub.js) in a real headless browser and checks ~100 DOM
# assertions (tests/run_test.mjs) covering filters, sorting, the county map,
# the Archive/stale-data-warning views, CSV export, and the detail modal.
# Catches front-end regressions before they ship - this repo has shipped a
# couple of stale/broken deploys by hand in the past that a smoke test like
# this would have caught.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # The fixture's one calendar-formatted assertion (staleWarningText) is
  # locked to a fixed UTC timestamp - keep the runner's clock in UTC so it
  # doesn't drift with GitHub's runner locale.
  TZ: UTC

jobs:
  test:
    if: "!contains(github.event.head_commit.message, 'Auto-sync: mirror public/ to repo root')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build a throwaway serve directory (public/ + test fixtures)
        run: |
          set -euo pipefail
          rm -rf /tmp/serve
          mkdir -p /tmp/serve
          cp -r public/. /tmp/serve/
          cp -r tests/vendor /tmp/serve/vendor
          cp tests/config.js /tmp/serve/config.js
          # fl-counties.svg lives at repo root (not mirrored into public/,
          # same as config.js) but app.js fetches it at runtime for the
          # county map - without it the map never renders and the map
          # assertions below hang waiting for SVG paths that don't exist.
          if [ -f fl-counties.svg ]; then
            cp fl-counties.svg /tmp/serve/fl-counties.svg
          else
            echo "::error::fl-counties.svg not found at repo root - county map test will fail"
            exit 1
          fi

          # Production index.html/tx.html deliberately have no importmap
          # (they load the real @supabase/supabase-js from esm.sh) - inject
          # one in each throwaway copy so app.js resolves to the local
          # fixture stub instead of hitting the network. tx.html added
          # Phase 34, alongside run_test.mjs's tx.html navigation - same
          # sed, same anchor line, both files share that exact script tag.
          sed -i 's#<script src="config.js"></script>#<script src="config.js"></script>\n<script type="importmap">{"imports":{"https://esm.sh/@supabase/supabase-js@2":"./vendor/supabase-stub.js"}}</script>#' /tmp/serve/index.html /tmp/serve/tx.html /tmp/serve/la.html /tmp/serve/mi.html /tmp/serve/wy.html /tmp/serve/sc.html /tmp/serve/co.html /tmp/serve/wi.html /tmp/serve/mo.html /tmp/serve/ok.html /tmp/serve/pa.html /tmp/serve/mn.html /tmp/serve/admin.html
          grep -q 'importmap' /tmp/serve/index.html
          grep -q 'importmap' /tmp/serve/tx.html
          grep -q 'importmap' /tmp/serve/la.html
          for st in mi wy sc co wi mo ok pa mn; do grep -q 'importmap' /tmp/serve/$st.html; done
          grep -q 'importmap' /tmp/serve/admin.html

      - name: Serve app
        run: |
          nohup python3 -m http.server 8934 --directory /tmp/serve > /tmp/http.log 2>&1 &
          sleep 1
          curl -sf http://localhost:8934/index.html > /dev/null

      - name: Run regression test
        run: node tests/run_test.mjs

  # Read-only check of what a signed-out visitor is actually SERVED by a
  # deployment (scripts/check_deployed_branding.py): the sign-in block and
  # title of every state page must name the product, never one state. On a
  # pull request it reads the Cloudflare branch preview (when one exists) and
  # reports production as it stands; on a push to main it waits for the
  # production build and fails if the deployed shell is still state-branded.
  deployed-login:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Branch preview deployment
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: python3 scripts/check_deployed_branding.py --preview-branch "$BRANCH" --require --wait 600

      - name: Production deployment
        env:
          REQUIRE: ${{ github.event_name == 'push' && '--require --wait 900' || '' }}
        run: python3 scripts/check_deployed_branding.py --base https://rodz-taxdeeds.pages.dev --base https://taxacq.com $REQUIRE

      # The custom domain (2026-10-07) must serve the same deployment as the
      # Pages hostname: verified TLS, no redirect loop, byte-identical shell
      # files, same CSP, no mixed content, www never a second copy.
      - name: Custom domain serves the production deployment
        env:
          WAIT: ${{ github.event_name == 'push' && '--wait 900' || '' }}
        run: python3 scripts/check_custom_domain.py --domain https://taxacq.com --reference https://rodz-taxdeeds.pages.dev --www https://www.taxacq.com --require $WAIT

      # Sign-up runs through the self-signup Edge Function (2026-10-04). Only
      # refused payloads are sent: no account is ever created by this check.
      - name: Self-signup Edge Function reachable (CORS + validation)
        run: |
          python3 scripts/check_self_signup.py --origin https://rodz-taxdeeds.pages.dev
          python3 scripts/check_self_signup.py --origin https://taxacq.com

      # Signed-out browser load of both hosts: sign-in screen, app boot,
      # service worker scope + control, same-origin requests, no mixed
      # content / CSP violations. Nothing is typed or submitted.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Live browser check (taxacq.com + pages.dev)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/check_live_browser.mjs https://taxacq.com https://rodz-taxdeeds.pages.dev
