          python3 - <<'PY'
          import json, urllib.request, urllib.error
          FN = "https://cqnnnvpbocafuvpzfbzu.supabase.co/functions/v1/self-signup"
          TOKEN = "https://cqnnnvpbocafuvpzfbzu.supabase.co/auth/v1/token?grant_type=password"
          KEY = "sb_publishable_rk5440vza8jwE04v0Rn08w_vltFMEyQ"
          email = "claude-live-test-20261004@example.com"
          pw = "Live-test-pass-2026"
          def post(url, body, headers):
              req = urllib.request.Request(url, data=json.dumps(body).encode(), method="POST", headers={"Content-Type": "application/json", **headers})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r: return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  try: return e.code, json.loads(e.read() or b"{}")
                  except Exception: return e.code, {}
