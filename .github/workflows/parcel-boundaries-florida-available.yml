# Parcel outlines for Florida AVAILABLE (Lands Available) properties, from the
# DOR PTO county PIN shapefiles (Map Data / <year>F / <year>F PIN).
#
# Manual dispatch, plus a weekly scheduled apply approved by the owner on
# 2026-11-16 (outlines were last loaded 2026-10-27, so every listing added since
# had none). A manual run defaults to dry_run: it downloads each county's file,
# matches, and prints counts, writing nothing; apply needs the confirm input to
# be exactly APPLY. Only the ledgers chosen are read: Available by default;
# auctions and certificates only when named. The scheduled run applies to all
# three ledgers with the default match mode - the same rules as a manual apply. Needs the existing
# SUPABASE_URL / SUPABASE_SERVICE_KEY secrets and
# migrations 034 + 035 applied. See scripts/load_florida_available_boundaries.py.

name: parcel-boundaries-florida-available

on:
  schedule:
    # Mondays 09:20 UTC, clear of the harvest runs.
    - cron: "20 9 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run (default, no writes) or apply"
        type: choice
        options: [dry_run, apply]
        default: dry_run
        required: true
      confirm:
        description: "Type APPLY to allow writes when mode is apply"
        type: string
        default: ""
        required: false
      year:
        description: "DOR Map Data year folder (2026 = 2026F)"
        type: string
        default: "2026"
        required: true
      counties:
        description: "Optional comma-separated counties; empty = every county with active properties of the chosen ledgers"
        type: string
        default: ""
        required: false
      ledgers:
        description: "Ledgers to outline: laft = Available only (default); all = Available, auctions and certificates"
        type: choice
        options: [laft, "laft,auction,certificate"]
        default: laft
        required: true
      match_mode:
        description: "validated_id_only = validated NAL PARCEL_ID only, never the listing's parcel number"
        type: choice
        options: [listing_location_confirmed, validated_id_only]
        default: listing_location_confirmed
        required: true

permissions:
  contents: read

concurrency:
  group: parcel-boundaries-florida
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pyshp pyproj

      - name: Load Florida Available outlines
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODE: ${{ github.event_name == 'schedule' && 'apply' || inputs.mode }}
          CONFIRM: ${{ github.event_name == 'schedule' && 'APPLY' || inputs.confirm }}
          YEAR: ${{ inputs.year || '2026' }}
          COUNTIES: ${{ inputs.counties }}
          MATCH_MODE: ${{ inputs.match_mode || 'listing_location_confirmed' }}
          LEDGERS: ${{ github.event_name == 'schedule' && 'laft,auction,certificate' || inputs.ledgers }}
        run: python3 scripts/load_florida_available_boundaries.py --mode "$MODE" --confirm "$CONFIRM" --year "$YEAR" --counties "$COUNTIES" --match-mode "$MATCH_MODE" --ledgers "$LEDGERS"
