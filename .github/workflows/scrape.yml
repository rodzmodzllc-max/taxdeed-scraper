name: Nationwide 50-State Tax Deed Scraper Schedule

# DISABLED (auto-run) — the daily cron below is commented out.
#
# scraper.js does not actually scrape any county site: scrapeCountyRecords()
# generates simulated records with Math.sin()-based pseudo-randomness, and
# most of US_STATES' counties are placeholder names ("County-1", etc).
# It also writes to a `tax_auctions` table with a different schema
# (state/parcel_id/opening_bid/auction_type/auction_date) that the live app
# never reads from - the app reads `properties`, populated by the separate
# PC-based sync scripts (sync-to-supabase.ps1 / sync-harvest-to-supabase.ps1).
#
# Net effect while this ran on a schedule: zero impact on production data,
# while burning up to three 360-minute CI runners every day. Left as
# workflow_dispatch only so it can still be triggered by hand (e.g. while
# building this out into a real scraper against `properties`), without
# spending CI minutes on autopilot for a job that doesn't do anything yet.
on:
  # schedule:
  #   - cron: '0 6 * * *'   # was: every day at 06:00 UTC (2:00 AM EDT)
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  scrape:
    name: Scrape (${{ matrix.auction_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Up to 6 hours max per runner

    strategy:
      fail-fast: false # Keeps other matrix jobs running if one fails
      matrix:
        auction_type: [liens, deeds, land_available]

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Scraper for ${{ matrix.auction_type }}
        env:
          AUCTION_TYPE: ${{ matrix.auction_type }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scraper.js --type=${{ matrix.auction_type }}
