name: Nationwide 50-State Tax Deed Scraper Schedule

on:
  schedule:
    # Runs every day at 06:00 UTC (2:00 AM EDT)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  scrape:
    name: Scrape (${{ matrix.auction_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max per matrix runner

    strategy:
      fail-fast: false # If one category fails, the other two continue running
      matrix:
        auction_type: [liens, deeds, land_available]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Scraper for ${{ matrix.auction_type }}
        env:
          AUCTION_TYPE: ${{ matrix.auction_type }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # PROXY_URL: ${{ secrets.PROXY_URL }} # Uncomment if using proxies
        run: node scraper.js --type=${{ matrix.auction_type }}