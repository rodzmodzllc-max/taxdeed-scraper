name: Sync public/ to repo root

# Cloudflare Pages deploys this repo from its ROOT, not from public/.
# public/ is the folder that actually gets edited day to day, so whenever
# it changes on main we mirror the deployed files back down to root
# automatically instead of relying on a human to remember to do it by hand
# (which is how this repo ended up stale on the live site more than once).
#
# Only the files that are actually part of the deployed bundle are synced -
# root also holds config.js, scraper.js, schema*.sql, package.json, etc.
# that are NOT part of the public/ mirror and must be left alone.
#
# THE LIST BELOW IS THE WHOLE POINT OF FAILURE OF THIS WORKFLOW. It was
# written when the bundle was six files, and the Explore map added four more
# (explore.js, explore.css, fl-cities.json, fl-zips.json) without anybody
# updating it. The result was silent and lasted several commits: public/ was
# correct, main was green, and the live site was still serving a two-commit-old
# explore.js and 404ing on fl-zips.json, because the sync job cheerfully
# reported success after copying the six files it had heard of. A missing file
# now fails the job instead of warning, and the guard step after it fails if
# public/ holds a deployable file the list does not name - so the next time
# somebody adds one, CI says so on that commit rather than the site going
# quietly stale.

on:
  push:
    branches: [main]
    paths:
      - "public/**"

permissions:
  contents: write

concurrency:
  group: sync-public-to-root
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Mirror deployed files from public/ to root
        run: |
          set -euo pipefail

          # Exact file set confirmed to be the deployed bundle in public/.
          # Update this list if the deployed file set ever changes - and the
          # guard step below will fail the build if you forget.
          FILES="_headers app.js explore.css explore.js fl-cities.json fl-zips.json index.html manifest.webmanifest styles.css sw.js"
          echo "FILES=$FILES" >> "$GITHUB_ENV"

          for f in $FILES; do
            if [ -f "public/$f" ]; then
              cp "public/$f" "./$f"
            else
              # Not a warning. A named file that has gone missing means the
              # bundle changed shape and root is about to be wrong.
              echo "::error::public/$f is named in FILES but does not exist"
              exit 1
            fi
          done

          # icons/ is part of the deployed bundle too; mirror it wholesale.
          if [ -d "public/icons" ]; then
            mkdir -p ./icons
            rsync -a --delete public/icons/ ./icons/
          fi

      # Catches the failure mode that started all this: a new deployable file
      # lands in public/ and nothing mirrors it, because FILES never heard of
      # it. Anything in public/ that is a real deployed asset must be named
      # above; genuinely non-deployed files go in the skip list.
      - name: Fail if public/ holds a deployable file FILES does not name
        run: |
          set -euo pipefail

          # Files that live in public/ but are deliberately NOT mirrored.
          NOT_DEPLOYED="README.md"

          missing=""
          for path in public/*; do
            [ -f "$path" ] || continue
            f="$(basename "$path")"
            case " $FILES $NOT_DEPLOYED " in
              *" $f "*) continue ;;
            esac
            missing="$missing $f"
          done

          if [ -n "$missing" ]; then
            echo "::error::public/ holds deployable file(s) not mirrored to root:$missing"
            echo "Add them to FILES in .github/workflows/sync-public-to-root.yml"
            echo "(or to NOT_DEPLOYED if they genuinely should not ship)."
            echo "Cloudflare Pages serves the ROOT copy - an unmirrored file"
            echo "means the live site 404s or serves a stale version of it."
            exit 1
          fi

          echo "Every deployable file in public/ is named in FILES."

      - name: Commit and push if anything changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Root already matches public/ - nothing to sync."
            exit 0
          fi

          # Same list the mirror step used, so the two can never drift apart.
          git add $FILES icons
          git commit -m "Auto-sync: mirror public/ to repo root [skip ci]"
          git push
