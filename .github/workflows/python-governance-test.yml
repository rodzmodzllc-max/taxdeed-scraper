name: Python governance tests

# Phase 10A (harvesters/governance/) added a source-registry / ingestion-gate
# / provenance layer with its own test suite (tests/python/) but never wired
# it into CI - this workflow closes that gap. Mirrors this repo's existing
# playwright-test.yml pattern (same on: triggers, same "fail the build on
# test failure" contract, same one-job-one-purpose shape) rather than
# inventing a different CI convention or folding this into
# harvest-and-sync.yml, which is a production data pipeline (scheduled
# harvest/sync jobs against real Supabase credentials), not a test workflow -
# these tests need neither Supabase credentials nor network access to any
# vendor site (see tests/python/test_source_governance.py's own header
# comment: pure unit tests against harvesters/governance/, no live HTTP
# calls anywhere in the suite).
#
# No requirements.txt/pyproject.toml exists anywhere in this repo (every
# existing Python job in harvest-and-sync.yml does a bare `pip install
# <package>` per job instead - see e.g. its `texas` job's "Install Python
# dependencies" step). Matched here rather than introducing a new
# dependency-management convention - see the install step below for what is
# installed and why each package is there. harvesters/governance/ itself
# still imports nothing beyond the standard library; the additions are for
# test files that read a workflow's YAML or import a production script.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  governance-tests:
    if: "!contains(github.event.head_commit.message, 'Auto-sync: mirror public/ to repo root')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pyyaml added Phase 42: tests/python/test_phase42_workflow_validation.py
      # parses .github/workflows/lgbs-acquisition-validation.yml and would
      # otherwise skip silently here, reporting green while asserting nothing.
      #
      # requests added Phase 52. The suite still makes no network call - that
      # contract is unchanged, and every test that touches a request fakes it.
      # But tests/python/test_phase51_enrichment_scoping.py and
      # test_phase52_fdor_field_expansion.py drive the REAL
      # scripts/enrich_property_details.py rather than a copy of its logic,
      # and importing that module imports requests. Without it here, all 66 of
      # those tests error out at collection with ModuleNotFoundError while the
      # other 623 pass - which is how this was found.
      #
      # Installing it is deliberately preferred over stubbing requests into
      # sys.modules in the fixtures: a stub would make CI green against a fake
      # the production script never runs with, which is the wrong direction
      # for a suite whose whole purpose is catching things that only show up
      # against the real thing.
      #
      # pdfplumber added with tests/python/test_laft_pdf_parcel_plausibility.py,
      # which imports the real scripts/harvest_laft_pdfs.py (same reasoning as
      # requests above). No PDF is ever opened by the suite.
      - name: Install pytest
        run: pip install pytest pyyaml requests pdfplumber

      # Deliberately NOT continue-on-error, NOT `|| true`, NOT a soft-fail
      # wrapper of any kind (Phase 10B Step 3's explicit requirement) - a
      # failing governance test fails this job, and a failing job on a
      # required check blocks the merge the same way playwright-test.yml's
      # job already does for frontend regressions.
      - name: Run governance test suite (tests/python/)
        run: pytest tests/python/ -v
