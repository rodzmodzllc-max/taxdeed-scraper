name: Harvest FL tax deed data and sync to Supabase

# Runs the real statewide harvester (previously only ever run by hand on a
# local PC) on a schedule, entirely on GitHub's runners. No local machine
# involved anymore.
#
# deeds: harvest_all_counties.ps1 (44 Realauction counties) +
#   harvest_okaloosa_bid4assets.ps1 (Bid4Assets), then synced
#   to the `properties` table (source='auction'). Twice a day.
#   A sanity check runs after the sync (see scripts/sanity_check_deeds.ps1)
#   that fails the job - triggering the repo's existing "failed
#   workflows only" email notification, already confirmed active under
#   Settings -> Notifications -> Actions - if too few counties show
#   fresh active data, the class of "ran clean but harvested nothing
#   useful" bug that let the Hillsborough county-count mislabeling go
#   unnoticed until a manual cross-check (see improvement-roadmap.md).
#   Finally, scripts/geocode_properties.py backfills latitude/longitude
#   on up to 250 not-yet-geocoded rows per run (free US Census Bureau
#   Geocoder), so the frontend's Street View link lands on the actual
#   parcel instead of an address-search guess. Requires
#   schema-v8-geocoding.sql to have been run against Supabase once
#   (see repo root) - until then this step fails loudly, same
#   intentional-failure pattern as the certificates sync below.
# certificates: harvest_lienhub_certificates.ps1 (32 LienHub counties),
#   then synced to `properties` (source='certificate'). Once a
#   day. EXPERIMENTAL - see the script's own header comment.
#   Requires schema-v4-certificates.sql to have been run
#   against Supabase once (see repo root) - until then this
#   job's sync step will fail loudly, which is intentional so
#   it doesn't get missed.
# laft: Nine harvesters, one sync script, all tagged
#   `properties` (source='laft'). Once a day.
#   - harvest_laft_pdfs.py: PDF-published counties
#     (../data/laft_pdf_sources.csv) - also covers Volusia's ASP.NET
#     disclaimer-postback page, which turned out to just redirect to a
#     fixed, non-session-gated PDF URL (see that CSV's Volusia row).
#   - harvest_laft_html.py: plain static-HTML-table counties
#     (../data/laft_html_sources.csv) - 3 of these 19 counties
#     (Escambia, Columbia, Union) route through a ScraperAPI proxy
#     fallback when directly blocked - see SCRAPERAPI_KEY below. Also
#     covers Gadsden's old Excel-frameset disclaimer page, which turned
#     out to be plain static HTML with no real session gate at all (see
#     that CSV's Gadsden row).
#   - harvest_laft_realtdm.py: counties on the RealTDM
#     shared case-management platform
#     (../data/laft_realtdm_counties.csv) - a real HTML
#     form POST, no JS engine needed despite looking like a
#     JS search app
#   - harvest_laft_pioneer.py: counties on the Pioneer/TaxSmartWeb
#     platform (../data/laft_pioneer_counties.csv) - one domain per
#     county rather than a shared subdomain. Needs a real headless
#     browser (Playwright/Chromium) rather than a plain `requests` POST -
#     confirmed live 2026-08-25 that a plain POST (from `requests` or
#     the browser's own fetch() API) silently returns the blank search
#     form instead of real results, even though a real browser click +
#     navigation works every time. See that script's own module
#     docstring for the full story.
#   - harvest_laft_orange.py: Orange County's own Comptroller-run "TDSM"
#     tax-deed search tool (or.occompt.com/recorder/tdsmweb/) - a fifth,
#     unrelated platform found on 2026-08-25, not CSV-driven since no
#     other county has been found on it yet. Public guest access via a
#     disclaimer "I Acknowledge" click (no login, no credentials) then a
#     plain server-rendered form POST with Status=Lands Available. See
#     that script's own module docstring for the full access-pattern
#     writeup.
#   - harvest_laft_stlucie.py: St. Lucie County's AcclaimWeb/TributeWeb
#     tax-deed search tool (acclaimweb.stlucieclerk.gov/TributeWeb/) - a
#     sixth, unrelated platform found on 2026-08-25, not CSV-driven since
#     no other county has been found on it yet. Also needs a real
#     headless browser (same class of hidden-panel dependency as
#     Pioneer's tab-activation bug) - see that script's own module
#     docstring.
#   - harvest_laft_osceola.py: Osceola County's own NewVision Systems
#     search tool (officialrecords.osceolaclerk.org/browserviewtd/) - a
#     seventh, unrelated platform found on 2026-08-25, not CSV-driven
#     since no other county has been found on it yet. Also needs a real
#     headless browser (same hidden-tab dependency as Pioneer/St. Lucie),
#     plus its own ag-Grid virtualization handling (a real headless-browser
#     requirement none of the other six harvesters need) - see that
#     script's own module docstring.
#   - harvest_laft_hillsborough.py: Hillsborough County's OnBase-based
#     "Public Access View" (PAV) search tool
#     (publicaccess.hillsclerk.com/TD/) - an eighth, unrelated platform
#     found on 2026-08-25, not CSV-driven since no other county has been
#     found on it yet. Its default "Lands Available" search type is
#     misleading - it actually returns EVERY tax-deed case/document-type in
#     the date range unless the Case Status field is explicitly set to
#     "LANDS FOR SALE" (a value read out of a hidden `<datalist>`, not any
#     visible dropdown UI). Also needs the real Chromium browser installed
#     above (Angular reactive-forms fields need a native-setter + dispatched
#     -events fill, not a plain value assignment), plus a per-case dedupe
#     step since this platform files one row per document type per case -
#     see that script's own module docstring for the full story.
#   - harvest_laft_leon.py: Leon County's lforms.leonclerk.com portal
#     (added 2026-08-31) - a ninth, unrelated platform. Unlike the other
#     eight, the page itself has no real HTML table at all (an empty
#     DataTables skeleton populated client-side via AJAX), so this
#     harvester skips the rendered page entirely and hits the JSON data
#     file (listoflands.txt) it loads from directly - no headless browser
#     needed. Leon was also removed from data/laft_html_sources.csv,
#     since the static-HTML scan that file feeds could never find real
#     rows on that page. See that script's own module docstring.
#   All eight added/expanded 2026-08 after a from-scratch 67-county
#   research pass plus a follow-up pass on 6 newly-discovered platforms.
#   A meaningful chunk of the rest of Florida's counties still gate LAFT
#   behind a DIFFERENT search portal (Miami-Dade's GovHub/TaxSys and
#   Broward's TaxSys chief among them) - none of the eight harvesters here
#   handle those yet; each CSV grows as more counties get confirmed on a
#   format already handled, and a new harvester is needed to add another
#   platform.
#
# All three harvest jobs upload their raw harvest as a workflow artifact
# (30-day retention) regardless of whether the Supabase sync succeeds, so a bad
# sync never means lost data - re-run just the sync by hand from the artifact if
# needed.
#
# backup: a fourth job (scripts/export_backup.py) exports the live Supabase
#   tables to plain JSON/CSV as a 90-day artifact. A raw harvest artifact only
#   preserves what the counties published that day; it can NOT restore hand
#   research (lien_level/lien_note/notes/favorites), the FDOR enrichment
#   (just value, parcel coordinates, year built, living area, lot size, legal
#   description, sale history), or the status/gone_since history that is
#   derived from the sequence of harvests over time. This job is deliberately
#   independent of the harvest jobs, so it still runs - and still produces a
#   restorable copy - on a day when a harvester is broken.
#
# Change detection: the LAFT harvesters consult scripts/harvest_cache.py, which
#   records each source's ETag / Last-Modified / content hash between runs (via
#   the actions/cache step in the laft job). A county whose published list is
#   unchanged since the last run skips the expensive re-parse entirely instead
#   of being re-downloaded and re-parsed from scratch every single run. Any
#   cache miss falls straight through to the original full fetch-and-parse.

on:
  schedule:
    - cron: '0 10 * * *'  # ~6:00 AM ET (10:00 UTC) - deeds + okaloosa
    - cron: '0 22 * * *'  # ~6:00 PM ET (22:00 UTC) - deeds + okaloosa
    - cron: '0 12 * * *'  # ~8:00 AM ET (12:00 UTC) - certificates + laft
  workflow_dispatch:  # manual trigger from the Actions tab, runs all jobs
    inputs:
      force_harvest:
        description: >-
          Bypass scripts/harvest_cache.py entirely for this run (every LAFT
          sub-harvester re-fetches and re-parses every source, and the
          RealTDM purchase-price lookups all hit the network again) -
          useful right after touching harvester/parsing logic, when a
          cached-but-wrong result must not be trusted. Leave unchecked for
          a normal manual run.
        required: false
        type: boolean
        default: false
      job:
        description: >-
          Which job to run on this manual dispatch. "all" is the historical
          behaviour (every job, INCLUDING the manual-only Texas / LGBS job).
          Pick one job to run only that ledger's normal path - e.g. "laft" for
          the AVAILABLE sync without touching the Texas vendor feed. Scheduled
          runs ignore this.
        required: false
        type: choice
        default: all
        options: [all, deeds, certificates, laft, texas, backup, evidence, outcomes, expansion]
      evidence_counties:
        description: >-
          (job=evidence only) Comma-separated county names to limit the
          purchase-evidence capture. Blank = every FL AVAILABLE production source.
        required: false
        default: ''
      evidence_realauction_dates:
        description: >-
          (job=evidence only) Comma-separated PAST sale dates (MM/DD/YYYY) for
          RealAuction result-label discovery. Blank = skip.
        required: false
        default: ''
      evidence_scope:
        description: >-
          (job=evidence only) "available" = the AVAILABLE purchase-process
          capture (default). "auction_results" = skip it and read only the
          RealAuction CLOSED / CANCELED area of evidence_realauction_dates
          through the harvester's own anonymous AJAX endpoint, value-free.
          "state_sources" = read only the candidate (non-production) state
          sources' pages, documents and terms pages, structure only
          (scripts/capture_state_sources.py). "expansion" = the six-state
          sprint's candidate inventory pages and statewide parcel services
          (EXPANSION_TARGETS), value-free. "field_fill" = per-field fill
          rates of every configured ArcGIS layer (scripts/probe_field_fill.py).
        required: false
        type: choice
        default: available
        options: [available, auction_results, state_sources, expansion, field_fill]

concurrency:
  group: harvest-and-sync
  cancel-in-progress: false

jobs:
  deeds:
    name: Harvest deed auctions + sync
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Skip this job on the certificates-only schedule (12:00 UTC), but always
    # run it on the other two schedules and on manual dispatch.
    if: (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'deeds' || github.event.inputs.job == '')) || github.event.schedule == '0 10 * * *' || github.event.schedule == '0 22 * * *'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Harvest Realauction counties (44 counties)
        shell: pwsh
        run: ./scripts/harvest_all_counties.ps1

      - name: Harvest Okaloosa (Bid4Assets)
        shell: pwsh
        continue-on-error: true  # never verified end-to-end yet - don't let it block the main sync
        run: ./scripts/harvest_okaloosa_bid4assets.ps1

      - name: Prepare artifact (public evidence + encrypted raw)
        # Artifacts of a public repository are public. This writes
        # out/public/deeds-evidence.json (run identity, the per-source
        # completeness/status file verbatim, hashes, row counts, field names -
        # never a row value) and, when the ARTIFACT_PUBLIC_KEY repository variable is set,
        # an OpenPGP-encrypted copy of each raw file under out/private/. See
        # scripts/artifact_evidence.py and docs/production-configuration.md.
        # harvest_all_status.json (the per-county completeness file the sync
        # closeout and the Phase B writer read) is passed as --status so it is
        # reproduced verbatim inside the public evidence file.
        if: always()
        env:
          ARTIFACT_PUBLIC_KEY: ${{ vars.ARTIFACT_PUBLIC_KEY }}
        run: python3 scripts/artifact_evidence.py --job deeds --status out/harvest_all_status.json "out/harvest_all.*"

      - name: Upload artifact (evidence + encrypted raw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvest-deeds-${{ github.run_id }}
          path: |
            out/public/
            out/private/
          retention-days: 30
          if-no-files-found: warn

      - name: Sync to Supabase
        id: sync
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./scripts/sync-harvest-to-supabase.ps1

      - name: Record source health
        # Monitoring only (migration 016 + scripts/source_health.py): one row
        # per dataset - last attempt, last success, row count, how many units
        # the harvester's own completeness gate marked COMPLETE, the error.
        # Never retries, never re-harvests, never fails the job; a missing
        # source_health table is a warning, not an error. Reads the sync
        # step's outcome so a failed sync is recorded as FAILED, not skipped.
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/source_health.py --source fl_deeds --label "Florida deed auctions (county auction sites)" --state FL --mode scheduled --cadence-hours 12 --status out/harvest_all_status.json --rows out/harvest_all.json --outcome ${{ steps.sync.outcome }}

      - name: Sanity check - fresh county coverage
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./scripts/sanity_check_deeds.ps1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies (geocoding)
        run: pip install requests

      # Phase B (auction-event history): record what this run's harvest saw
      # as auction_events + auction_event_observations (migration 014). Runs
      # AFTER the property sync above and only reads `properties` to resolve
      # ids - it never writes the property snapshot. continue-on-error so a
      # writer problem can never fail the property pipeline this job exists
      # for; the step's own log line is the record of what it did.
      - name: Record auction events (Phase B)
        id: phase_b_events_fl
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/auction_events_writer.py --source fl

      # Makes a Phase B failure visible without failing the property harvest:
      # the step above is continue-on-error, so on its own a failure would
      # leave the job green. This raises a warning annotation on the run and
      # a job-summary section saying exactly which part failed.
      - name: Report Phase B event recording failure
        if: ${{ !cancelled() && steps.phase_b_events_fl.outcome == 'failure' }}
        run: |
          echo "::warning title=Phase B event recording failed (FL)::Property harvest and sync succeeded; Phase B auction-event recording FAILED. auction_events / auction_event_observations were not updated by this run - see the 'Record auction events (Phase B)' step log."
          {
            echo "## Phase B event recording (FL): FAILED"
            echo ""
            echo "- Property harvest and sync: **succeeded** (earlier steps)"
            echo "- Phase B auction-event recording: **failed** - see the 'Record auction events (Phase B)' step log"
          } >> "$GITHUB_STEP_SUMMARY"

      # Verified auction outcomes (scripts/auction_outcomes.py): for sale days
      # in the last 21 days, reads the SAME RealAuction host's "Auctions
      # Closed or Canceled" listing and the page's own status refresh through
      # the harvester's anonymous session, matches items to events by exact
      # case number, and records a result only for a reviewed wording in
      # data/auction_outcome_wordings.csv. Never infers from absence; a
      # failed read writes nothing. Allowed to error, so it can never fail
      # the property pipeline.
      - name: Verified auction outcomes (source-published results only)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/auction_outcomes.py

      - name: Inventory status - normalized lifecycle state (migration 021)
        # Inventory status (migration 021): each row's normalized lifecycle state and
        # its observation history - scripts/inventory_status_writer.py. sold / redeemed /
        # withdrawn / cancelled / struck_off only from a status the source published;
        # a row that left a list is 'closed'. Probes for migration 021 and plans only
        # until it is applied. Never fails the job.
        if: always() && steps.sync.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/inventory_status_writer.py --state FL

      - name: Per-unit freshness (deed auction counties)
        # Per-unit freshness (scripts/unit_freshness.py): last attempted / last
        # successful / consecutive failures per county, persisted with the harvest
        # cache, counts to out/public, and - once migration 021's columns exist -
        # written to county_source_registry for the Dashboard. A FAILED attempt
        # never advances last_success_at. Never fails the job.
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/unit_freshness.py --status out/harvest_all_status.json:fl_deeds --state FL

      - name: Backfill geocoding (US Census Bureau Geocoder)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/geocode_properties.py

      - name: Backfill address/property-type enrichment (FL DOR statewide parcel lookup)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/enrich_property_details.py

      # Flood is the first Risk & Legal panel field with a real source. It
      # needs only lat/lon, which the geocoding step above has already
      # backfilled, and FEMA's National Flood Hazard Layer is a free public
      # national API - no per-county integration, unlike liens/judgments/code
      # violations. No-ops cleanly (exit 0) until
      # scripts/migrations/010_flood_hazard.sql has been applied.
      - name: Backfill FEMA flood hazard (National Flood Hazard Layer)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/enrich_flood_zone.py

      # NAIP aerial imagery: USDA/USGS, public domain, no API key, no
      # billing account, and no restriction on storing or re-serving the
      # bytes - which is why this runs today and the Street View step below
      # still does not. Aerial rather than street-level, which also covers
      # the vacant and unimproved parcels Street View has no imagery for at
      # all. No-ops cleanly until migration 011 is applied.
      - name: Backfill property imagery (USDA NAIP aerial)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/enrich_property_photos_naip.py

      - name: Backfill property photos (Street View Static API)
        # No-ops cleanly (exit 0) until a GOOGLE_MAPS_API_KEY secret exists -
        # see scripts/fetch_property_photos.py's module docstring and
        # CLAUDE.md's "Property photos" section. Requires
        # schema-v10-property-photos.sql to have been run once first.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python3 scripts/fetch_property_photos.py

  certificates:
    name: Harvest certificates + sync (experimental)
    runs-on: ubuntu-latest
    # Raised 30 -> 60 on 2026-09-01: the harvest step's own inter-county
    # jittered delays plus its escalating 20s/45s WAF-block backoff retries
    # (see harvest_lienhub_certificates.ps1's header comment) are a real,
    # deliberate anti-bot-block cost across 32 sequential LienHub sites,
    # not a hang - runs have legitimately taken 24-29 minutes against the
    # old 30-minute cap on ordinary days. A raw timeout kill loses the
    # ENTIRE run's data (nothing is written to disk until all 32 counties
    # finish), so 30 minutes left almost no margin for a day where more
    # counties than usual hit the retry path. Each county's own worst case
    # is still hard-bounded (three attempts of a 25s request timeout plus
    # 20s+45s backoff), so this isn't masking a true infinite hang.
    timeout-minutes: 60
    if: (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'certificates' || github.event.inputs.job == '')) || github.event.schedule == '0 12 * * *'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Harvest LienHub county-held certificates (32 counties)
        shell: pwsh
        run: ./scripts/harvest_lienhub_certificates.ps1

      - name: Prepare artifact (public evidence + encrypted raw)
        # Artifacts of a public repository are public. This writes
        # out/public/certificates-evidence.json (run identity, the per-source
        # completeness/status file verbatim, hashes, row counts, field names -
        # never a row value) and, when the ARTIFACT_PUBLIC_KEY repository variable is set,
        # an OpenPGP-encrypted copy of each raw file under out/private/. See
        # scripts/artifact_evidence.py and docs/production-configuration.md.
        if: always()
        env:
          ARTIFACT_PUBLIC_KEY: ${{ vars.ARTIFACT_PUBLIC_KEY }}
        run: python3 scripts/artifact_evidence.py --job certificates --status out/harvest_certificates_status.json "out/harvest_certificates.*"

      - name: Upload artifact (evidence + encrypted raw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvest-certificates-${{ github.run_id }}
          path: |
            out/public/
            out/private/
          retention-days: 30
          if-no-files-found: warn

      - name: Sync to Supabase
        id: sync
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./scripts/sync-certificates-to-supabase.ps1

      - name: Record source health
        # Monitoring only (migration 016 + scripts/source_health.py): one row
        # per dataset - last attempt, last success, row count, how many units
        # the harvester's own completeness gate marked COMPLETE, the error.
        # Never retries, never re-harvests, never fails the job; a missing
        # source_health table is a warning, not an error. Reads the sync
        # step's outcome so a failed sync is recorded as FAILED, not skipped.
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/source_health.py --source fl_certificates --label "Florida county-held certificates (LienHub)" --state FL --mode scheduled --cadence-hours 24 --status out/harvest_certificates_status.json --rows out/harvest_certificates.json --outcome ${{ steps.sync.outcome }}

  laft:
    name: Harvest Lands Available PDFs + sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'laft' || github.event.inputs.job == '')) || github.event.schedule == '0 12 * * *'
    env:
      # Read by scripts/harvest_cache.py's load_cache() - "true" makes every
      # LAFT sub-harvester in this job (PDFs, HTML-table, RealTDM's
      # purchase-price lookups) act as if nothing had ever been cached, so
      # every run's harvest is a full, unconditional fetch+parse. Empty
      # string (the default on a scheduled run, which has no `inputs`
      # context at all) is falsy to load_cache()'s check, so this is a
      # no-op unless a workflow_dispatch run explicitly checks the box.
      FORCE_HARVEST: ${{ github.event.inputs.force_harvest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore harvest change-detection cache
        # Persists scripts/harvest_cache.py's per-source ETag / Last-Modified /
        # content-hash record between runs, which is what lets the harvesters
        # skip re-parsing a county whose published list hasn't changed since
        # last time. Rolling-cache pattern: the unique key means every run
        # saves a fresh entry, and restore-keys pulls the most recent previous
        # one. A cache miss is harmless - the harvesters simply do the full
        # fetch-and-parse they always did.
        uses: actions/cache@v4
        with:
          path: out/.harvest_cache
          key: harvest-cache-laft-${{ github.run_id }}
          restore-keys: |
            harvest-cache-laft-

      - name: Install Python dependencies
        run: pip install pdfplumber requests beautifulsoup4 playwright

      - name: Install Playwright browser
        # The Pioneer/TaxSmartWeb, St. Lucie/AcclaimWeb, Osceola/NewVision, and
        # Hillsborough/PAV steps below are the only ones needing a real browser - every other LAFT harvester
        # reproduces its target with a plain `requests` POST. See each
        # script's module docstring for why a real browser is required
        # there (a plain POST, whether from `requests` or from the
        # browser's own fetch() API, was confirmed live 2026-08-25 to
        # silently return the blank search form instead of real results).
        # --with-deps installs the system libraries Chromium needs on the
        # bare ubuntu-latest runner image.
        run: playwright install --with-deps chromium

      - name: Harvest Lands Available for Taxes PDFs
        run: python3 scripts/harvest_laft_pdfs.py

      - name: Harvest Lands Available for Taxes HTML-table counties
        # Independent of the PDF harvester (different counties, different
        # script) - always() so a bad run of one never silently skips the
        # other, matching the per-county try/except discipline inside each
        # script itself.
        if: always()
        env:
          # Proxy fallback for the 3 counties (Escambia, Columbia, Union)
          # whose WAF 403s GitHub Actions' runner IPs specifically even with
          # a full browser header set (confirmed live 2026-08-25 - see
          # harvest_laft_html.py's module docstring and SCRAPERAPI_KEY
          # comment). Free tier at https://www.scraperapi.com (5,000
          # requests/month; this job only needs ~90/month). Every other
          # county in this step is unaffected whether or not this secret is
          # set - it's only read as a fallback after a direct 403. Add this
          # secret at Settings -> Secrets and variables -> Actions once a
          # free ScraperAPI account exists.
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python3 scripts/harvest_laft_html.py

      - name: Harvest Lands Available for Taxes RealTDM-platform counties
        # Same independence rationale as the HTML-table step above - a
        # third, unrelated vendor platform (see harvest_laft_realtdm.py).
        if: always()
        run: python3 scripts/harvest_laft_realtdm.py

      - name: Cache hit-ratio summary
        # Advisory only, never fails the job - reads the tiny per-harvester
        # JSON stats files scripts/harvest_cache.py's record_cache_stats()
        # writes for the three steps above (PDFs, HTML-table, RealTDM) and
        # appends a markdown table to this run's summary page, so the
        # caching layer's actual effect is visible at a glance instead of
        # requiring someone to open each step's raw log. See
        # scripts/print_cache_stats.py's module docstring.
        if: always()
        run: python3 scripts/print_cache_stats.py

      - name: Harvest Lands Available for Taxes Pioneer/TaxSmartWeb-platform counties
        # Same independence rationale again - a fourth, unrelated vendor
        # platform, uniquely requiring the real Chromium browser installed
        # above (see harvest_laft_pioneer.py's module docstring).
        if: always()
        run: python3 scripts/harvest_laft_pioneer.py

      - name: Harvest Lands Available for Taxes Orange County (TDSM)
        # Same independence rationale again - a fifth, unrelated platform
        # (Orange County's own Comptroller-run search tool, not a shared
        # vendor CSV like the others since no second county has turned up
        # on it). Public guest disclaimer access only, no credentials -
        # see harvest_laft_orange.py's module docstring.
        if: always()
        run: python3 scripts/harvest_laft_orange.py

      - name: Harvest Lands Available for Taxes St. Lucie County (AcclaimWeb)
        # Same independence rationale again - a sixth, unrelated platform
        # (St. Lucie's AcclaimWeb/TributeWeb tax-deed search, not a shared
        # vendor CSV like the others since no second county has turned up
        # on it). Also requires the real Chromium browser installed above -
        # see harvest_laft_stlucie.py's module docstring.
        if: always()
        run: python3 scripts/harvest_laft_stlucie.py

      - name: Harvest Lands Available for Taxes Osceola County (NewVision)
        # Same independence rationale again - a seventh, unrelated platform
        # (Osceola's own NewVision Systems search tool, not a shared vendor
        # CSV like the others since no second county has turned up on it).
        # Also requires the real Chromium browser installed above, plus its
        # own ag-Grid scroll/virtualization handling - see
        # harvest_laft_osceola.py's module docstring.
        if: always()
        run: python3 scripts/harvest_laft_osceola.py

      - name: Harvest Lands Available for Taxes Hillsborough County (PAV)
        # Same independence rationale again - an eighth, unrelated platform
        # (Hillsborough's own OnBase-based Public Access View search tool,
        # not a shared vendor CSV like the others since no second county has
        # turned up on it). Also requires the real Chromium browser installed
        # above, plus the Case Status='LANDS FOR SALE' filter and per-case
        # dedupe across document-type rows - see
        # harvest_laft_hillsborough.py's module docstring.
        if: always()
        run: python3 scripts/harvest_laft_hillsborough.py

      - name: Harvest Lands Available for Taxes Leon County
        # A ninth, unrelated platform - unlike the other eight, Leon's
        # page has no real HTML table (an empty DataTables skeleton
        # populated client-side via AJAX), so this one skips the rendered
        # page and hits the JSON data file it loads from directly. No
        # headless browser needed - see harvest_laft_leon.py's module
        # docstring.
        if: always()
        run: python3 scripts/harvest_laft_leon.py

      - name: Prepare artifact (public evidence + encrypted raw)
        # Artifacts of a public repository are public. This writes
        # out/public/laft-evidence.json (run identity, the per-source
        # completeness/status file verbatim, hashes, row counts, field names -
        # never a row value) and, when the ARTIFACT_PUBLIC_KEY repository variable is set,
        # an OpenPGP-encrypted copy of each raw file under out/private/. See
        # scripts/artifact_evidence.py and docs/production-configuration.md.
        # LAFT rows carry owner names and addresses - exactly the data that
        # must not sit in a public artifact. The per-county status file
        # (scripts/laft_status.py: county, harvester, status, counts, error
        # category, source URL - never a row value) is included verbatim.
        if: always()
        env:
          ARTIFACT_PUBLIC_KEY: ${{ vars.ARTIFACT_PUBLIC_KEY }}
        run: python3 scripts/artifact_evidence.py --job laft --status out/harvest_laft_status.json "out/harvest_laft*.*"

      - name: Upload artifact (evidence + encrypted raw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvest-laft-${{ github.run_id }}
          path: |
            out/public/
            out/private/
          retention-days: 30
          if-no-files-found: warn

      - name: Sanity check - LAFT anomaly detection
        # Advisory only (never fails the job) - flags a county that's
        # previously had real data but produced 0 rows in today's fresh
        # harvest, the same failure class sanity_check_deeds.ps1 catches
        # for the deeds job. See sanity_check_laft.ps1's own header
        # comment for why this has to run BEFORE the sync and compare
        # against Supabase's existing counts, not after.
        if: always()
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./scripts/sanity_check_laft.ps1

      - name: Sync to Supabase
        id: sync
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./scripts/sync-laft-to-supabase.ps1

      - name: Record source health
        # Monitoring only (migration 016 + scripts/source_health.py): one row
        # per dataset - last attempt, last success, row count, how many units
        # the harvester's own completeness gate marked COMPLETE, the error.
        # Never retries, never re-harvests, never fails the job; a missing
        # source_health table is a warning, not an error. Reads the sync
        # step's outcome so a failed sync is recorded as FAILED, not skipped.
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # Every LAFT harvester writes its counties into
        # out/harvest_laft_status.json (scripts/laft_status.py) - COMPLETE /
        # EMPTY / INCOMPLETE / FAILED per county - so fl_laft's completeness
        # is derived from that file (a county not COMPLETE/EMPTY counts as
        # incomplete) and its row count is the sum of the per-county counts.
        run: python3 scripts/source_health.py --source fl_laft --label "Florida Lands Available for Taxes (county lists)" --state FL --mode scheduled --cadence-hours 24 --status out/harvest_laft_status.json --outcome ${{ steps.sync.outcome }}

      - name: LAFT lifecycle - last_seen_at, gated close-out, reactivation
        # scripts/laft_lifecycle.py, after the upsert: rows a COMPLETE or
        # INCOMPLETE county actually read this run are observed (last_seen_at,
        # back to 'active' if they had been closed); rows missing from a
        # COMPLETE or EMPTY county's list are closed out. A FAILED, INCOMPLETE,
        # STALE or NOT_RUN county closes nothing - fail closed, like the
        # deeds job. Until migration 017 is applied it limits itself to the
        # status column and says so; it never applies a migration, never
        # re-harvests, never retries a source.
        if: always() && steps.sync.outcome == 'success'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/laft_lifecycle.py

      - name: Inventory status - normalized lifecycle state (migration 021)
        # Inventory status (migration 021): each row's normalized lifecycle state and
        # its observation history - scripts/inventory_status_writer.py. sold / redeemed /
        # withdrawn / cancelled / struck_off only from a status the source published;
        # a row that left a list is 'closed'. Probes for migration 021 and plans only
        # until it is applied. Never fails the job.
        if: always() && steps.sync.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/inventory_status_writer.py --state FL

      - name: Per-unit freshness (county lists)
        # Per-unit freshness (scripts/unit_freshness.py): last attempted / last
        # successful / consecutive failures per county, persisted with the harvest
        # cache, counts to out/public, and - once migration 021's columns exist -
        # written to county_source_registry for the Dashboard. A FAILED attempt
        # never advances last_success_at. Never fails the job.
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/unit_freshness.py --status out/harvest_laft_status.json --state FL

      - name: Publication gate (source-level customer publication, migration 022)
        # scripts/publication_gate.py: one decision per SOURCE from
        # data/county_source_registry.csv (harvesters/governance/publication.py),
        # written to out/public/publication-gate.json with the AVAILABLE
        # measurement (observed / publishable / restricted / unreviewed /
        # blocked / with purchase path / stale - counts only) and, once
        # migration 022's column exists, propagated to
        # properties.publication_status so the frontend can withhold
        # restricted inventory. Probes for 022 and plans only until then.
        # Never fails the job; never activates a source.
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/publication_gate.py --state FL

      # ---- Louisiana (2026-09-30, state-expansion sprint) --------------------
      # East Baton Rouge Parish's open-data "Adjudicated Property" dataset
      # (harvesters/otc/adapters/louisiana.py; docs/state-expansion.md). A
      # DATED list: every row carries list_as_of = the dataset's own
      # rows-updated date and is never shown as available now. Its own status
      # and harvest files (out/harvest_louisiana*.json - parish names never mix
      # with Florida's). Every step is allowed to fail without touching the
      # Florida steps above; a FAILED read syncs nothing and closes nothing.
      - name: Louisiana adjudicated inventory - harvest (East Baton Rouge)
        id: la_harvest
        if: always()
        continue-on-error: true
        run: python3 scripts/harvest_state_inventory.py --state LA

      - name: Louisiana - sync to Supabase
        id: la_sync
        if: always() && steps.la_harvest.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/sync_state_inventory.py --state LA --status out/harvest_louisiana_status.json

      - name: Louisiana - lifecycle (last_seen_at, gated close-out)
        if: always() && steps.la_sync.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/laft_lifecycle.py --state LA --status out/harvest_louisiana_status.json --harvest out/harvest_louisiana.json --report out/public/laft-lifecycle-la.json

      - name: Louisiana - freshness and publication gate
        # No inventory-status mapping exists for an adjudicated list
        # (harvesters/governance/inventory_status.status_for_row returns None
        # for LA), so no normalized status is written - none is invented.
        # Own persist / report files: Florida's are never overwritten.
        if: always() && steps.la_harvest.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 scripts/unit_freshness.py --status out/harvest_louisiana_status.json --state LA --persist out/.harvest_cache/unit_freshness_la.json --report out/public/unit-freshness-la.json || true
          python3 scripts/publication_gate.py --state LA --report out/public/publication-gate-la.json

  expansion:
    # Six-state expansion (2026-09-30; docs/six-state-expansion.md). The
    # owner-approved county sources of MI, WY, SC, CO and WI
    # (harvesters/otc/adapters/expansion.py) through the shared ArcGIS /
    # HTML-table adapters, one matrix leg per state. Runs in the existing
    # 12:00 UTC slot (no new schedule) or on dispatch with job=expansion /
    # all. Every leg: harvest -> sync (+ absence close-out for COMPLETE /
    # EMPTY counties only) -> statewide parcel enrichment (only where a
    # cleared ParcelSourceConfig exists: CO) -> freshness + publication
    # gate. A leg is refused before any request if its state or source is
    # not activated / approved. No leg touches FL / TX / LA rows.
    name: Harvest six-state expansion (${{ matrix.state }}) + sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'expansion' || github.event.inputs.job == '')) || github.event.schedule == '0 12 * * *'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        state: [MI, WY, SC, CO, WI]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4

      - name: Harvest
        id: harvest
        run: python3 scripts/harvest_expansion.py --state ${{ matrix.state }}

      - name: Sync to Supabase (+ absence close-out)
        id: sync
        if: always() && steps.harvest.outcome == 'success'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          st=$(echo "${{ matrix.state }}" | tr '[:upper:]' '[:lower:]')
          python3 scripts/sync_state_inventory.py --state ${{ matrix.state }} --status "out/harvest_${st}_status.json" --close-absent

      - name: Statewide parcel enrichment (deterministic id match)
        if: always() && steps.sync.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/enrich_statewide_parcels.py --state ${{ matrix.state }}

      - name: Freshness and publication gate
        if: always() && steps.harvest.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          st=$(echo "${{ matrix.state }}" | tr '[:upper:]' '[:lower:]')
          python3 scripts/unit_freshness.py --status "out/harvest_${st}_status.json" --state ${{ matrix.state }} --persist "out/.harvest_cache/unit_freshness_${st}.json" --report "out/public/unit-freshness-${st}.json" || true
          python3 scripts/publication_gate.py --state ${{ matrix.state }} --report "out/public/publication-gate-${st}.json"

      - name: Evidence-only artifact summary
        # Public repository -> public artifacts: counts, hashes and field names
        # only; raw files only OpenPGP-encrypted (scripts/artifact_evidence.py).
        if: always()
        continue-on-error: true
        env:
          ARTIFACT_PUBLIC_KEY: ${{ vars.ARTIFACT_PUBLIC_KEY }}
        run: |
          st=$(echo "${{ matrix.state }}" | tr '[:upper:]' '[:lower:]')
          python3 scripts/artifact_evidence.py --job "expansion-${st}" --status "out/harvest_${st}_status.json" "out/harvest_${st}.*"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expansion-evidence-${{ matrix.state }}-${{ github.run_id }}
          path: |
            out/public/
            out/private/
          if-no-files-found: ignore
          retention-days: 14

  texas:
    name: Harvest Texas tax sales (LGBS) + sync - manual only, not yet on cron
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # MANUAL-ONLY for now, per the flip sequence this comment previously laid
    # out: harvest_lgbs() and scripts/sync-texas-to-supabase.py are real as
    # of 2026-09-09 (LGBS's public property_sales API - see
    # texas_harvester.py's module docstring for the live-verified field
    # semantics, county-name normalization, and the account_number/
    # cause_number -> case_no/parcel mapping). harvest_pbfcm()/
    # harvest_govease() are still `raise NotImplementedError(...)` stubs -
    # main() skips them with a warning and still writes out/harvest_texas.json
    # from whatever vendors ARE implemented, so this job produces real LGBS
    # data today even though PBFCM/GovEase aren't wired up yet.
    # enrich_property_details_tx.py's CAD lookups (_fetch_dcad/_fetch_bcad/
    # _fetch_travis_cad) are a separate, unrelated pipeline (see
    # texas_harvester.py's module docstring: "harvest first, FDOR-equivalent
    # enrichment after", same as Florida) and are not a blocker here.
    #
    # Next step per the original flip sequence: run this manually
    # (workflow_dispatch) and verify it end-to-end against production
    # (correct county names, no non-TX rows, sane bid/value figures), THEN
    # add a real cron entry under `on: schedule:` above - not before.
    #
    # Sync step targets `on_conflict=state,source,county,case_no` from day
    # one (not the old FL-only on_conflict target) since Texas rows only
    # ever exist post-004_widen_unique_constraint_for_state.sql - no
    # fallback needed here the way the three FL sync scripts have one.
    # Runs only on a dispatch that asks for it ("all" or "texas") - a
    # single-ledger dispatch (e.g. job=laft) never touches the LGBS feed.
    if: github.event_name == 'workflow_dispatch'
      && (github.event.inputs.job == 'all' || github.event.inputs.job == 'texas' || github.event.inputs.job == '')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests

      - name: Harvest Texas tax sales (LGBS / PBFCM / GovEase)
        run: python3 harvesters/texas_harvester.py

      - name: Prepare artifact (public evidence + encrypted raw)
        # Artifacts of a public repository are public. This writes
        # out/public/texas-evidence.json (run identity, the per-source
        # completeness/status file verbatim, hashes, row counts, field names -
        # never a row value) and, when the ARTIFACT_PUBLIC_KEY repository variable is set,
        # an OpenPGP-encrypted copy of each raw file under out/private/. See
        # scripts/artifact_evidence.py and docs/production-configuration.md.
        if: always()
        env:
          ARTIFACT_PUBLIC_KEY: ${{ vars.ARTIFACT_PUBLIC_KEY }}
        run: python3 scripts/artifact_evidence.py --job texas --status out/harvest_texas_status.json "out/harvest_texas.*"

      - name: Upload artifact (evidence + encrypted raw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvest-texas-${{ github.run_id }}
          path: |
            out/public/
            out/private/
          retention-days: 30
          if-no-files-found: warn

      - name: Sync to Supabase
        id: sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/sync-texas-to-supabase.py

      - name: Record source health
        # Monitoring only (migration 016 + scripts/source_health.py): one row
        # per dataset - last attempt, last success, row count, how many units
        # the harvester's own completeness gate marked COMPLETE, the error.
        # Never retries, never re-harvests, never fails the job; a missing
        # source_health table is a warning, not an error. Reads the sync
        # step's outcome so a failed sync is recorded as FAILED, not skipped.
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/source_health.py --source tx_sales --label "Texas tax sales (LGBS + county sheriff-sale sites) - manual runs" --state TX --mode manual --status out/harvest_texas_status.json --rows out/harvest_texas.json --outcome ${{ steps.sync.outcome }}

      # Phase B (auction-event history): same writer as the deeds job, fed by
      # out/harvest_texas.json. Texas has no per-county completeness file, so
      # the writer applies no absence-based transitions here (see its header).
      - name: Record auction events (Phase B)
        id: phase_b_events_tx
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/auction_events_writer.py --source tx

      # Makes a Phase B failure visible without failing the property harvest:
      # the step above is continue-on-error, so on its own a failure would
      # leave the job green. This raises a warning annotation on the run and
      # a job-summary section saying exactly which part failed.

      - name: Inventory status - normalized lifecycle state (migration 021)
        # Inventory status (migration 021): each row's normalized lifecycle state and
        # its observation history - scripts/inventory_status_writer.py. sold / redeemed /
        # withdrawn / cancelled / struck_off only from a status the source published;
        # a row that left a list is 'closed'. Probes for migration 021 and plans only
        # until it is applied. Never fails the job.
        if: always() && steps.sync.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/inventory_status_writer.py --state TX
      - name: Report Phase B event recording failure
        if: ${{ !cancelled() && steps.phase_b_events_tx.outcome == 'failure' }}
        run: |
          echo "::warning title=Phase B event recording failed (TX)::Property harvest and sync succeeded; Phase B auction-event recording FAILED. auction_events / auction_event_observations were not updated by this run - see the 'Record auction events (Phase B)' step log."
          {
            echo "## Phase B event recording (TX): FAILED"
            echo ""
            echo "- Property harvest and sync: **succeeded** (earlier steps)"
            echo "- Phase B auction-event recording: **failed** - see the 'Record auction events (Phase B)' step log"
          } >> "$GITHUB_STEP_SUMMARY"

  backup:
    name: Export database backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs on the daily 12:00 UTC schedule alongside certificates/laft, and on
    # any manual dispatch. Deliberately does NOT depend on the harvest jobs:
    # the whole point is to capture what is in the database, so it must still
    # produce a backup on a day when a harvester is broken - that is exactly
    # the day a backup matters most.
    if: (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'backup' || github.event.inputs.job == '')) || github.event.schedule == '0 12 * * *'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests

      - name: Export Supabase tables to portable JSON/CSV
        id: sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/export_backup.py

      - name: Record source health
        # Monitoring only (migration 016 + scripts/source_health.py): one row
        # per dataset - last attempt, last success, row count, how many units
        # the harvester's own completeness gate marked COMPLETE, the error.
        # Never retries, never re-harvests, never fails the job; a missing
        # source_health table is a warning, not an error. Reads the sync
        # step's outcome so a failed sync is recorded as FAILED, not skipped.
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/source_health.py --source db_backup --label "Database backup export" --state ALL --mode scheduled --cadence-hours 24 --status out/backup/manifest.json --outcome ${{ steps.sync.outcome }}

      - name: Prepare artifact (public evidence + encrypted backup)
        # A database backup holds `notes` (customer text and author e-mail)
        # and every property row. It is NEVER uploaded in the clear: only
        # out/public/backup-evidence.json (the manifest - table names, row
        # counts, SHA-256 per file - verbatim) is always uploaded, and the
        # tables themselves only as OpenPGP-encrypted copies under
        # out/private/ when the ARTIFACT_PUBLIC_KEY repository variable is set. Until that
        # secret exists, this job proves the export ran but retains no
        # restorable copy - see docs/production-configuration.md, "Artifact
        # encryption key" (a launch dependency).
        if: always()
        env:
          ARTIFACT_PUBLIC_KEY: ${{ vars.ARTIFACT_PUBLIC_KEY }}
        run: python3 scripts/artifact_evidence.py --job backup --status out/backup/manifest.json "out/backup/*"

      - name: Upload artifact (evidence + encrypted backup)
        # 90 days rather than the harvest jobs' 30: a raw harvest is
        # reproducible by re-running the scraper, but hand research, the FDOR
        # enrichment and the status/gone_since history in these tables are not
        # reproducible from any source. Longer retention costs nothing and is
        # the difference between an inconvenience and permanent data loss.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: |
            out/public/
            out/private/
          retention-days: 90
          if-no-files-found: error

  evidence:
    # Purchase-evidence capture - MANUAL ONLY (job=evidence), never on a
    # schedule and never part of "all". Fetches the same canonical pages /
    # documents the production AVAILABLE registry rows already name and
    # writes a value-free capture of the purchase / application process
    # text they publish (scripts/capture_purchase_evidence.py). A person
    # reads the capture and records verified evidence rows in
    # data/purchase_path_evidence.csv; scripts/purchase_path_engine.py then
    # applies them deterministically on the next laft run. Nothing here
    # writes to the database and nothing here is a purchase path.
    name: Capture purchase / application evidence (manual only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'evidence'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 pdfplumber

      - name: Capture
        env:
          COUNTIES: ${{ github.event.inputs.evidence_counties }}
          RA_DATES: ${{ github.event.inputs.evidence_realauction_dates }}
          SCOPE: ${{ github.event.inputs.evidence_scope }}
        run: |
          if [ "$SCOPE" = "state_sources" ]; then
            # Candidate states only (AL / AR / LA / AZ): structure, CSV headers
            # and value shapes, dataset licence metadata, terms pages. Nothing
            # is written to any database and nothing is enabled.
            python3 scripts/capture_state_sources.py --discovery
            exit 0
          fi
          if [ "$SCOPE" = "field_fill" ]; then
            # Per-field FILL RATES of every configured ArcGIS layer (the
            # expansion inventory layers and the statewide parcel layers):
            # names, types and filled counts out of a sample, never a value.
            python3 scripts/probe_field_fill.py
            exit 0
          fi
          if [ "$SCOPE" = "expansion" ]; then
            # Six-state sprint candidates: structure, licence / terms text,
            # ArcGIS layer fields, counts and identifier SHAPES. Nothing is
            # written to any database and nothing is enabled.
            python3 scripts/capture_state_sources.py --expansion --skip-registry
            exit 0
          fi
          args=""
          if [ "$SCOPE" = "auction_results" ]; then args="--skip-available --realauction-results"; fi
          IFS=',' read -ra cs <<< "$COUNTIES"
          for c in "${cs[@]}"; do c="$(echo "$c" | xargs)"; [ -n "$c" ] && args="$args --county \"$c\""; done
          IFS=',' read -ra ds <<< "$RA_DATES"
          for d in "${ds[@]}"; do d="$(echo "$d" | xargs)"; [ -n "$d" ] && args="$args --realauction-date $d"; done
          # --follow: one hop to acquisition links PRESENT on each source page
          # (capped, no search engines / vendors; scripts/capture_purchase_evidence.py).
          eval python3 scripts/capture_purchase_evidence.py --state FL --follow $args

      - name: Print capture (value-free; readable from the job log without downloading the artifact)
        if: always()
        run: |
          echo "::group::purchase-evidence digest"
          if [ -f out/public/field-fill.json ]; then
            echo "field fill rates printed by the capture step above"
          elif [ -f out/public/state-source-capture.json ]; then
            python3 scripts/capture_state_sources.py --digest out/public/state-source-capture.json
          else
            python3 scripts/capture_purchase_evidence.py --digest out/public/purchase-evidence-capture.json
          fi
          echo "::endgroup::"

      - name: Prepare artifact (public evidence only)
        # The capture is county-level process text, already value-free; it
        # is reproduced verbatim inside the public evidence file. No raw
        # harvest file exists in this job, so nothing is encrypted.
        if: always()
        env:
          ARTIFACT_PUBLIC_KEY: ${{ vars.ARTIFACT_PUBLIC_KEY }}
        run: |
          status=out/public/purchase-evidence-capture.json
          [ -f out/public/state-source-capture.json ] && status=out/public/state-source-capture.json
          [ -f out/public/field-fill.json ] && status=out/public/field-fill.json
          python3 scripts/artifact_evidence.py --job purchase-evidence --status "$status"

      - name: Upload artifact (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purchase-evidence-${{ github.run_id }}
          path: |
            out/public/
            out/private/

  outcomes:
    # Verified auction outcomes on their own - MANUAL ONLY (job=outcomes),
    # never scheduled, never part of "all" (the deeds job already runs the
    # same step after every harvest). No harvest, no property write: it reads
    # auction_events and appends observations / patches events only for
    # source-published results (scripts/auction_outcomes.py).
    name: Verified auction outcomes (manual only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'outcomes'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests

      - name: Verified auction outcomes (source-published results only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/auction_outcomes.py

      - name: Prepare artifact (public evidence only)
        # The report is counts only (no case number, parcel, amount or
        # name); it is reproduced verbatim inside the public evidence file.
        if: always()
        env:
          ARTIFACT_PUBLIC_KEY: ${{ vars.ARTIFACT_PUBLIC_KEY }}
        run: python3 scripts/artifact_evidence.py --job auction-outcomes --status out/public/auction-outcomes.json

      - name: Upload artifact (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auction-outcomes-${{ github.run_id }}
          path: |
            out/public/
            out/private/
