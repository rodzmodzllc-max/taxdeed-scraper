name: LGBS acquisition validation (tx_lgbs)

# Phase 42. Runs the repository's EXISTING LGBS acquisition engine against
# the real taxsales.lgbs.com endpoint from a GitHub Actions runner.
#
# Why this workflow exists at all: Phases 39-41 built and unit-tested the
# acquisition engine, but every attempt to execute it against the live
# source from the development sandbox was refused by that environment's
# egress proxy (gateway 403 on CONNECT). Phase 41 classified that
# ENVIRONMENT_EGRESS_BLOCKED and deliberately declined to call the engine
# validated, because its network path had only ever been exercised against
# the blocked case. GitHub Actions is a known-good egress path for this
# exact host - harvest-and-sync.yml's `texas` job already runs
# harvest_lgbs() against it successfully - so it is the cheapest honest way
# to get the first real end-to-end evidence.
#
# This workflow is an EXECUTION ENVIRONMENT, nothing more. It contains no
# LGBS client, no pagination logic, no filtering, no normalization and no
# acquisition accounting. Every one of those lives in
# scripts/run_lgbs_acquisition.py and harvesters/acquisition/, and this
# file only invokes them (Phase 42 Section 5). If you find yourself adding
# `curl` or a second LGBS URL here, that is the bug.
#
# Deliberately NOT on a schedule and NOT on push. A real acquisition run
# reaches out to a third party's servers; it happens when a human asks for
# it, in a mode they chose explicitly. This mirrors harvest-and-sync.yml's
# `texas` job, which is also workflow_dispatch-only.
#
# No secrets are used, requested or referenced anywhere in this file. The
# acquisition engine needs none: it reads a public, unauthenticated API and
# writes a JSON artifact. It has no Supabase client and no production write
# path at all (asserted by test_p01 in
# tests/python/test_phase41_controlled_acquisition.py, which parses every
# module with ast and fails if any DB driver is imported or any DML literal
# appears). That is why this workflow can safely run without `secrets:`.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = connectivity only | sample = ~25 records | full = whole TX dataset'
        required: true
        default: 'probe'
        type: choice
        options:
          - probe
          - sample
          - full
      confirm_full:
        description: 'Type FULL to authorize a full acquisition (ignored for probe/sample)'
        required: false
        default: ''
        type: string
      limit:
        description: 'Optional sample size (positive integer, max 5000). Empty = 25. Ignored for probe/full.'
        required: false
        default: ''
        type: string
      run_diagnostics:
        description: 'Also run the read-only state-vs-area query diagnostics (18 small requests). Default off.'
        required: false
        default: false
        type: boolean

concurrency:
  # Never let two real acquisition runs hit the source concurrently.
  group: lgbs-acquisition-validation
  cancel-in-progress: false

jobs:
  acquire:
    name: 'LGBS ${{ inputs.mode }}'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The acquisition engine imports nothing outside the standard library
      # (same as harvesters/governance/ - see python-governance-test.yml's
      # header on why this repo installs per-job rather than carrying a
      # requirements.txt). pytest is here only for the pre-flight below.
      # pyyaml is needed only by tests/python/test_phase42_workflow_validation.py,
      # which parses this very file. Without it those tests skip silently,
      # which would make the pre-flight look green while checking nothing.
      - name: Install pytest
        run: pip install pytest pyyaml

      # Fail fast on a broken tree before touching anyone else's servers.
      # A CODE_FAILURE discovered here costs the source zero requests.
      - name: Pre-flight - acquisition test suite must pass
        run: pytest tests/python/test_phase39_acquisition_engine.py tests/python/test_phase40_roster_and_activation.py tests/python/test_phase41_controlled_acquisition.py tests/python/test_phase42_workflow_validation.py -q

      # Phase 48. The acquisition pre-flight above deliberately does NOT
      # gain the diagnostic's tests: with run_diagnostics off this workflow
      # must behave exactly as it did before, and that includes which tests
      # it runs. So the diagnostic brings its own gate, on the same
      # principle - a broken diagnostic costs the source zero requests.
      - name: Pre-flight - diagnostic test suite must pass
        if: inputs.run_diagnostics
        run: pytest tests/python/test_phase48_query_diagnostics.py -q

      # Phase 48. Compares the state= and area= filters at three page
      # sizes. The step NAME deliberately carries no query string: the
      # Phase 42 guard against acquisition logic leaking into YAML scans
      # executable lines and cannot tell a label from a request, and the
      # guard is worth more than a descriptive step name.
      #
      # Read-only measurement, and deliberately BEFORE the
      # acquisition step: this measures per-request latency, and running it
      # after the acquisition would measure a source we had just pulled up
      # to three 500-record pages from. Clean measurement first.
      #
      # `continue-on-error` is the point of the placement, not a softening:
      # the diagnostic's own result stays visible as a failed step, while
      # acquisition still runs. A measurement that could cancel the thing it
      # was measuring alongside would be worse than no measurement. The
      # acquisition step itself keeps its hard-fail contract untouched.
      #
      # Skipped entirely when run_diagnostics is false, which is the default:
      # with it off this workflow does exactly what it did before.
      - name: Query diagnostics (read-only, state vs area filters)
        if: inputs.run_diagnostics
        id: diagnostics
        run: |
          set -o pipefail
          rc=0
          python3 scripts/diagnose_lgbs_query_latency.py | tee diagnostics-console.log || rc=$?
          echo "diagnostic exit code: $rc"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 3 ]; then
            echo "::warning::Query diagnostics measured NOTHING - every request was blocked before leaving the runner. This says nothing about LGBS."
          fi
          # Exiting 0 HERE does not swallow the failure: the code is recorded
          # above and enforced by the final step below, after acquisition has
          # had its turn. The alternative - continue-on-error - would have
          # meant relaxing Phase 42's no-soft-fail guard, and a guard is
          # worth more than the convenience.
          exit 0

      - name: Guard - full mode requires explicit confirmation
        if: inputs.mode == 'full'
        run: |
          if [ "${{ inputs.confirm_full }}" != "FULL" ]; then
            echo "::error::mode=full requires confirm_full=FULL. Refusing to run a full acquisition without it."
            exit 1
          fi
          echo "full-mode confirmation accepted"

      # The ONLY step that talks to LGBS. Flags are the runner's real,
      # verified argparse options (--probe-only / --limit N / --full) - not
      # assumed. Exit codes come from the runner itself:
      #   0 = probe reachable, or run finished COMPLETE/PARTIAL
      #   2 = governance gate refused the source  -> AUTHORIZATION_BLOCKED
      #   3 = environment could not reach LGBS    -> ENVIRONMENT_EGRESS_BLOCKED
      #   4 = run finished in a non-COMPLETE/PARTIAL state
      # Deliberately no `|| true` and no continue-on-error: a failed
      # acquisition fails this job, matching python-governance-test.yml's
      # explicit no-soft-fail contract.
      - name: Run acquisition (${{ inputs.mode }})
        id: acquire
        # Phase 45: `limit` reaches the shell through env, never through
        # `${{ }}` interpolation - an input is attacker-controllable in
        # principle and must not be pasted into a command line. It is
        # validated as a positive integer <= 5000 before use, and an
        # invalid value fails the job rather than silently falling back to
        # a default (a silent fallback would make a typo look like a
        # successful 25-record run).
        env:
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          set -o pipefail
          case "${{ inputs.mode }}" in
            probe)  ARGS="--probe-only" ;;
            sample)
              LIMIT="${INPUT_LIMIT:-}"
              if [ -z "$LIMIT" ]; then
                LIMIT=25
              else
                case "$LIMIT" in
                  *[!0-9]*) echo "::error::limit must be a positive integer, got '$LIMIT'"; exit 1 ;;
                esac
                if [ "$LIMIT" -lt 1 ] || [ "$LIMIT" -gt 5000 ]; then
                  echo "::error::limit must be between 1 and 5000, got '$LIMIT'"; exit 1
                fi
              fi
              ARGS="--limit $LIMIT" ;;
            full)   ARGS="--full" ;;
            *) echo "::error::unknown mode '${{ inputs.mode }}'"; exit 1 ;;
          esac
          echo "invoking: python3 scripts/run_lgbs_acquisition.py $ARGS"
          python3 scripts/run_lgbs_acquisition.py $ARGS | tee acquisition-console.log

      # Phase 45: measurement only, and deliberately NOT part of the
      # acquisition runner. It queries ?state=TX - the one query that can
      # establish today's Texas denominator - and writes its own artifact.
      # It never touches TX_LGBS_STATE_DENOMINATOR, so the historical
      # 4,205 carry-forward and the current live figure stay distinguishable
      # in the evidence. Skipped for probe, which is meant to stay minimal.
      - name: Measure live TX denominator (validation only)
        # Phase 46: `always() &&` added. Without it a failed acquisition step
        # cancels this one, which is exactly what happened on run
        # 35109232214 - the measurement is independent of acquisition and
        # losing it to an unrelated failure is the opposite of useful.
        if: always() && inputs.mode != 'probe'
        run: |
          set -o pipefail
          python3 scripts/measure_tx_denominator.py | tee denominator-console.log

      # Surfaces the classification the RUNNER already computed. This reads
      # the artifact the runner wrote; it does not re-derive or re-classify
      # anything (Section 5 again - no logic duplication in YAML).
      - name: Summarize classification
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("out/acquisition/phase41_lgbs_run.json")
          if not p.exists():
              print("## LGBS acquisition\n\nNo artifact produced - the runner did not reach the reporting stage.")
              raise SystemExit(0)
          d = json.loads(p.read_text())
          run = d.get("run") or {}
          tally = run.get("tally") or {}
          check = d.get("denominator_check") or {}
          print("## LGBS acquisition\n")
          print(f"- environment: `{d.get('environment_status')}`")
          print(f"- governance gate: `{(d.get('governance_gate') or {}).get('registry_status')}` "
                f"allowed=`{(d.get('governance_gate') or {}).get('allowed')}`")
          print(f"- run status: `{run.get('status')}`")
          print(f"- production_data_modified: `{d.get('production_data_modified')}`\n")
          if tally:
              print("| metric | value |\n|---|---|")
              for k in ("records_observed_at_source", "records_seen", "records_acquired",
                        "records_rejected", "records_failed", "records_duplicated", "is_balanced"):
                  print(f"| {k} | {tally.get(k)} |")
              print(f"| rejections | `{tally.get('rejections_by_reason')}` |")
          if check:
              print(f"\n- denominator: expected `{check.get('expected')}`, "
                    f"reconciled `{check.get('reconciled_total')}`, "
                    f"variance `{check.get('variance')}`, passed `{check.get('passed')}`")
          PY

      # The artifact is the evidence. It contains acquisition metrics,
      # accounting and provenance metadata - no credentials, because the
      # engine never holds any (RetrievalMetadata has no field capable of
      # carrying one; asserted by test_c04 in
      # tests/python/test_phase39_acquisition_engine.py).
      # Phase 48. Deferred enforcement of the diagnostic's exit code. It runs
      # LAST so a diagnostic failure never prevents the acquisition it was
      # measuring alongside, while still failing the job rather than being
      # quietly absorbed.
      - name: Fail if the query diagnostics did not complete
        if: always() && inputs.run_diagnostics
        run: |
          rc="${{ steps.diagnostics.outputs.exit_code }}"
          if [ -z "$rc" ]; then
            echo "::error::the diagnostic step did not record an exit code"; exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::query diagnostics exited $rc"; exit 1
          fi
          echo "query diagnostics completed"

      - name: Upload acquisition artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lgbs-acquisition-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            out/acquisition/
            acquisition-console.log
            denominator-console.log
            diagnostics-console.log
          if-no-files-found: warn
          retention-days: 30
