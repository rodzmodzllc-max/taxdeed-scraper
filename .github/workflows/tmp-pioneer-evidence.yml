# Temporary, read-only: dry-runs scripts/harvest_clerk_statements.py on push
# to this throwaway branch (value-free report). No secrets, no database.
name: tmp pioneer statement evidence
on:
  push:
    branches: [tmp/pioneer-evidence]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          sudo apt-get install -y -qq tesseract-ocr >/dev/null
          pip install -q requests pdfplumber pytesseract
          python3 scripts/harvest_clerk_statements.py --counties Citrus,Duval,Palm\ Beach --report
