# Temporary, read-only: runs scripts/capture_pioneer_statements.py on push to
# this throwaway branch. No secrets, no database, nothing written.
name: tmp pioneer statement evidence
on:
  push:
    branches: [tmp/pioneer-evidence]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          sudo apt-get install -y -qq tesseract-ocr >/dev/null
          pip install -q requests pdfplumber pytesseract
          python3 scripts/capture_pioneer_statements.py
